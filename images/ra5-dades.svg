<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 210" role="img" aria-labelledby="title"><title id="title">Abans de recollir dades cal justificar-ne la finalitat i limitar-ne l’ús.</title><rect x="10" y="15" width="235" height="60" rx="8" fill="#eaf3f8" stroke="#22708c"/><text x="127.5" y="51" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#102c3b">Per a què les necessitem?</text><path d="M249 45h18m-5-5 5 5-5 5" stroke="#22708c" fill="none"/><rect x="270" y="15" width="235" height="60" rx="8" fill="#eaf3f8" stroke="#22708c"/><text x="387.5" y="51" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#102c3b">Quina base ho permet?</text><path d="M509 45h18m-5-5 5 5-5 5" stroke="#22708c" fill="none"/><rect x="530" y="15" width="235" height="60" rx="8" fill="#eaf3f8" stroke="#22708c"/><text x="647.5" y="51" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#102c3b">Quines dades calen?</text><rect x="10" y="105" width="235" height="60" rx="8" fill="#eaf3f8" stroke="#22708c"/><text x="127.5" y="141" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#102c3b">Qui hi pot accedir?</text><path d="M249 135h18m-5-5 5 5-5 5" stroke="#22708c" fill="none"/><rect x="270" y="105" width="235" height="60" rx="8" fill="#eaf3f8" stroke="#22708c"/><text x="387.5" y="141" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#102c3b">Quant temps es guarden?</text><path d="M509 135h18m-5-5 5 5-5 5" stroke="#22708c" fill="none"/><rect x="530" y="105" width="235" height="60" rx="8" fill="#eaf3f8" stroke="#22708c"/><text x="647.5" y="141" text-anchor="middle" font-size="16" font-family="sans-serif" fill="#102c3b">Com les protegim?</text></svg>