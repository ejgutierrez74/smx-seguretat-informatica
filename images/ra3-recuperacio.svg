<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" role="img" aria-labelledby="title"><title id="title">La via de recuperació depèn de la situació i dels recursos disponibles.</title><rect x="10" y="15" width="300" height="70" rx="8" fill="#eaf3f8" stroke="#22708c"/><text x="160.0" y="56" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#102c3b">Còpia fiable disponible</text><rect x="380" y="15" width="390" height="70" rx="8" fill="#eaf3f8" stroke="#22708c"/><text x="575.0" y="56" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#102c3b">Restaurar i verificar la versió</text><path d="M315 50h55m-8-7 8 7-8 7" fill="none" stroke="#22708c" stroke-width="2"/><rect x="10" y="115" width="300" height="70" rx="8" fill="#eaf3f8" stroke="#22708c"/><text x="160.0" y="156" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#102c3b">Sense còpia i suport llegible</text><rect x="380" y="115" width="390" height="70" rx="8" fill="#eaf3f8" stroke="#22708c"/><text x="575.0" y="156" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#102c3b">Duplicar i intentar recuperar</text><path d="M315 150h55m-8-7 8 7-8 7" fill="none" stroke="#22708c" stroke-width="2"/><rect x="10" y="215" width="300" height="70" rx="8" fill="#eaf3f8" stroke="#22708c"/><text x="160.0" y="256" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#102c3b">Avaria física</text><rect x="380" y="215" width="390" height="70" rx="8" fill="#eaf3f8" stroke="#22708c"/><text x="575.0" y="256" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#102c3b">Escalar i preservar el suport</text><path d="M315 250h55m-8-7 8 7-8 7" fill="none" stroke="#22708c" stroke-width="2"/></svg>